# DOIshot - static site; build only generates config.js from env vars.
#
# Environment variables (Site settings -> Environment variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY  -- optional; omit to disable usage tracking
[build]
  publish = "."
  command = "sh scripts/generate-config.sh"

# DOIs contain slashes; support a clean /doi/<doi> path by funnelling to the
# query-param flow the app already understands. Pure-static, proxy-safe.
[[redirects]]
  from = "/doi/*"
  to = "/?doi=:splat"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # style-src requires 'unsafe-inline' for inline card styles and html-to-image rendering.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Pi9sia6IhAQOM/da3Jgd0dJU+BPxIIDkDAGnWNIiHAE='; connect-src 'self' https://api.crossref.org https://api.datacite.org https://api.openalex.org https://*.supabase.co https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
